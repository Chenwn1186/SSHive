<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 48 48">
  <!-- SSHive 应用图标（主稿）
       48×48 网格 / 透明底 / 内容铺满 46/48 = 96%（与 Office 同级视觉尺寸）
       底板：2 列 × 3 行窗格（深浅色块 + 细分隔缝） -->
  <defs>
    <clipPath id="plate"><rect x="6" y="1" width="41" height="46" rx="4"/></clipPath>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.9" flood-color="#06231F" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- 层 1：底板 -->
  <g clip-path="url(#plate)">
    <rect x="6" y="1" width="41" height="46" fill="#0B6B62"/>
    <!-- 上行 -->
    <rect x="6"    y="1"    width="20.1" height="14.8" fill="#0EA5A0"/>
    <rect x="26.9" y="1"    width="20.1" height="14.8" fill="#0C9B96"/>
    <!-- 中行 -->
    <rect x="6"    y="16.6" width="20.1" height="14.8" fill="#0D9488"/>
    <rect x="26.9" y="16.6" width="20.1" height="14.8" fill="#0E8579"/>
    <!-- 下行 -->
    <rect x="6"    y="32.2" width="20.1" height="14.8" fill="#0E8579"/>
    <rect x="26.9" y="32.2" width="20.1" height="14.8" fill="#0E7C72"/>
  </g>

  <!-- 层 2：徽标底板 -->
  <rect x="1" y="21" width="18" height="18" rx="2" fill="#0E7C72" filter="url(#badgeShadow)"/>

  <!-- 层 3：终端提示符 -->
  <g stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 4.5 25.5 L 9 30 L 4.5 34.5"/>
    <path d="M 11.5 34.5 H 15.5"/>
  </g>
</svg>
